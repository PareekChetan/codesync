# Two backend instances. Nginx spreads connections across them.
# Users in the same room may land on DIFFERENT instances; that is fine,
# because the instances sync through Redis. No sticky sessions needed.
upstream codesync_api {
    least_conn;
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets never change, so let browsers cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://codesync_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Host page for the sandboxed HTML preview (served by the API with its own CSP).
    location /sandbox/ {
        proxy_pass http://codesync_api;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://codesync_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep long-lived editing sessions open
        proxy_send_timeout 3600s;
    }

    # Single-page app: every other path serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
