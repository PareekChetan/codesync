# Production add-on: Caddy in front for automatic HTTPS (free Let's Encrypt certificates).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# deploy.sh runs this for you.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
